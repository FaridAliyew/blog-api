services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: blog-backend
    env_file:
      - server/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: blog-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
